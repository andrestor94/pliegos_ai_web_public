<!-- templates/analysis/analysis_modal.html -->
<div id="analysis-modal"
     style="position:fixed;inset:0;z-index:9999;background:rgba(25,28,33,.62);display:block;">
  <div style="max-width:980px;margin:6vh auto;background:#fff;border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.18);overflow:hidden">
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e9ecef;">
      <div style="font-weight:600;font-size:16px">Elegí cómo ver el resultado</div>
      <div class="ms-auto"></div>
      <button type="button" data-close
              style="border:0;background:transparent;padding:6px 8px;font-size:18px;line-height:1;cursor:pointer">✕</button>
    </div>

    <!-- Paso 1: selector -->
    <div id="step-chooser" style="padding:16px">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="sa-card" data-mode="structured"
             style="flex:1 1 320px;border:1px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer">
          <div style="font-weight:600;margin-bottom:6px">Análisis estructurado</div>
          <div style="color:#6b7280;font-size:14px">Tabla + puntos clave (rápido para cotizar).</div>
        </div>
        <div class="sa-card" data-mode="deep"
             style="flex:1 1 320px;border:1px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer">
          <div style="font-weight:600;margin-bottom:6px">Análisis profundo</div>
          <div style="color:#6b7280;font-size:14px">Narrativa detallada con riesgos y excepciones.</div>
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <button type="button" data-close class="btn btn-light">Cancelar</button>
        <button type="button" id="confirm-mode" class="btn btn-primary" disabled>Continuar</button>
      </div>
    </div>

    <!-- Paso 2: resultado renderizado -->
    <div id="step-result" style="padding:0 0 10px 0;display:none">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid #e9ecef">
        <button type="button" id="go-back" class="btn btn-light btn-sm">← Volver</button>
        <div id="result-title" style="font-weight:600;margin-left:6px">Resultado</div>
        <div class="ms-auto"></div>
        <button type="button" id="download-pdf" class="btn btn-outline-primary btn-sm">
          Descargar PDF
        </button>
      </div>
      <div id="analysis-view" style="padding:16px;max-height:60vh;overflow:auto"></div>
    </div>

    <!-- El JSON del análisis llega aquí; lo lee setupAnalysisModal() -->
    <textarea id="analysis-json" class="d-none" style="display:none">{{ analysis_json|e }}</textarea>
  </div>
</div>
