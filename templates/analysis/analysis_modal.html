{# templates/analysis/analysis_modal.html #}

<!-- Overlay raíz que usa setupAnalysisModal -->
<div id="analysis-modal"
     style="position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:1050; padding:16px; background:rgba(0,0,0,.45);">

  <!-- Cerrar por click en backdrop -->
  <div data-close style="position:absolute; inset:0;"></div>

  <!-- Contenedor -->
  <div style="position:relative; width:min(1040px,92vw); max-height:88vh; overflow:hidden;
              background:#fff; border-radius:16px; box-shadow:0 12px 48px rgba(0,0,0,.28);">

    <!-- Header común -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid rgba(0,0,0,.06)">
      <h3 style="margin:0; font-size:1.1rem;">Análisis de pliego</h3>
      <button type="button" class="btn btn-light btn-sm" data-close>✕</button>
    </div>

    <!-- Body -->
    <div style="padding:16px 18px;">

      <!-- ===== Paso 1: Elección del modo ===== -->
      <div id="step-chooser">
        <p class="subtle mb-3">Seleccioná el tipo de análisis:</p>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <button type="button" data-mode="structured"
                    class="sa-card w-100 text-start border rounded-3 p-3 hover-shadow-sm">
              <div class="d-flex align-items-start gap-2">
                <span class="badge bg-primary-subtle text-primary me-1">📊</span>
                <div>
                  <div class="fw-semibold">Análisis Estructurado</div>
                  <div class="subtle">Extracción tabular de datos clave (tablas, cantidades, fechas, requisitos).</div>
                </div>
              </div>
            </button>
          </div>

          <div class="col-12 col-md-6">
            <button type="button" data-mode="deep"
                    class="sa-card w-100 text-start border rounded-3 p-3 hover-shadow-sm">
              <div class="d-flex align-items-start gap-2">
                <span class="badge bg-purple-subtle text-purple me-1">🧠</span>
                <div>
                  <div class="fw-semibold">Análisis Profundo</div>
                  <div class="subtle">Informe redactado con contexto, riesgos e insights ejecutivos.</div>
                </div>
              </div>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="button" class="btn" data-close>Cancelar</button>
          <button type="button" id="confirm-mode" class="btn btn-primary" disabled>Confirmar</button>
        </div>
      </div>

      <!-- ===== Paso 2: Resultado ===== -->
      <div id="step-result" style="display:none;">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-ghost btn-sm" id="go-back">← Volver</button>
            <h4 id="result-title" class="mb-0">Resultado</h4>
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="download-pdf" disabled>Descargar PDF</button>
        </div>

        <!-- Contenedor donde el helper inyecta el HTML -->
        <div id="analysis-view" class="prose" style="max-height:calc(88vh - 130px); overflow:auto;"></div>
      </div>

      <!-- Hidden con el JSON del análisis (lo usa setupAnalysisModal) -->
      <input type="hidden" id="analysis-json"
             value="{% if analysis_json is defined %}{{ analysis_json | tojson | safe }}{% else %}{}{% endif %}">
    </div>
  </div>
</div>
