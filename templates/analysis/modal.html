<!-- templates/analysis/modal.html -->
<div id="analysis-modal" class="sa-modal-overlay" role="dialog" aria-modal="true">
  <div class="sa-modal" role="document">
    <div class="sa-modal-header">
      <h3 class="m-0">Seleccioná el tipo de análisis</h3>
      <button type="button" class="sa-close" data-close>✕</button>
    </div>

    <div class="sa-modal-body">
      <!-- STEP 1: Selector -->
      <div id="step-chooser">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <button type="button" class="sa-pick cardx w-100" data-mode="structured">
              <div class="p-3">
                <div class="h5 mb-2">Análisis Estructurado</div>
                <div class="text-muted small">
                  Extracción de datos clave (tablas, cantidades, fechas, requisitos).
                </div>
              </div>
            </button>
          </div>
          <div class="col-12 col-md-6">
            <button type="button" class="sa-pick cardx w-100" data-mode="deep">
              <div class="p-3">
                <div class="h5 mb-2">Análisis Profundo</div>
                <div class="text-muted small">
                  Resumen redactado e insights de contexto y riesgos.
                </div>
              </div>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
          <button class="btn btn-primary" id="confirm-mode" disabled>Confirmar</button>
        </div>
      </div>

      <!-- STEP 2: Resultado -->
      <div id="step-result" class="d-none">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h4 id="result-title" class="m-0">Resultado</h4>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="go-back">Volver</button>
            <button class="btn btn-primary btn-sm" id="download-pdf">
              Descargar informe completo
            </button>
          </div>
        </div>

        <div id="analysis-view" class="sa-result"></div>
      </div>

      <!-- JSON una sola vez -->
      <input type="hidden" id="analysis-json" value='{{ analysis_json | tojson | safe }}'>
    </div>
  </div>
</div>

<style>
.sa-modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45);
  z-index:1055; display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.sa-modal{
  background:#fff; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.2);
  width:min(1080px,96vw); max-height:92vh; display:flex; flex-direction:column; overflow:hidden;
}
.sa-modal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid #e5e7eb;
}
.sa-modal-body{ padding:16px 18px 20px; overflow:auto; }
.sa-close{ border:0; background:transparent; padding:6px 10px; border-radius:8px; }
.sa-close:hover{ background:#f2f4f7; }

/* tarjetas selector */
.sa-pick{ border:1px solid #e6e8eb; border-radius:12px; text-align:left; transition:all .15s; }
.sa-pick:hover{ border-color:#cfd4da; box-shadow:0 2px 10px rgba(0,0,0,.05); }
.sa-pick.active{ border-color:#0d6efd; box-shadow:0 0 0 3px rgba(13,110,253,.15); }

/* contenedor de resultado con scroll interno si es largo */
.sa-result{ border:1px solid #eef0f2; border-radius:12px; padding:12px; max-height:66vh; overflow:auto; }
</style>

<script>
(function(){
  const overlay = document.getElementById('analysis-modal');
  const picks = overlay.querySelectorAll('.sa-pick');
  const confirmBtn = overlay.querySelector('#confirm-mode');
  const stepChooser = overlay.querySelector('#step-chooser');
  const stepResult  = overlay.querySelector('#step-result');
  const viewEl = overlay.querySelector('#analysis-view');
  const titleEl = overlay.querySelector('#result-title');
  const jsonEl  = overlay.querySelector('#analysis-json');
  const btnBack = overlay.querySelector('#go-back');
  const btnPdf  = overlay.querySelector('#download-pdf');

  let chosen = null;      // "structured" | "deep"
  let pdfEndpoint = "";   // /export/pdf/estructurado | /export/pdf/profundo

  // Cerrar con botón o ESC
  function close(){ overlay.remove(); }
  overlay.querySelector('[data-close]')?.addEventListener('click', close);
  document.addEventListener('keydown', function onEsc(e){
    if(e.key === 'Escape'){ close(); document.removeEventListener('keydown', onEsc); }
  });

  // Selección de tarjeta
  picks.forEach(b=>{
    b.addEventListener('click', ()=>{
      picks.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      chosen = b.getAttribute('data-mode');
      confirmBtn.disabled = !chosen;
    });
  });

  // Cargar vista seleccionada
  async function loadView(){
    const endpoint = chosen === 'structured' ? '/render/structured' : '/render/deep';
    pdfEndpoint = chosen === 'structured' ? '/export/pdf/estructurado' : '/export/pdf/profundo';
    titleEl.textContent = chosen === 'structured'
      ? 'Resultado del Análisis Estructurado'
      : 'Resultado del Análisis Profundo';

    const body = new URLSearchParams();
    body.set('analysis_json', jsonEl.value);

    viewEl.innerHTML = '<div class="text-muted">Cargando…</div>';
    const r = await fetch(endpoint, { method:'POST', body });
    viewEl.innerHTML = r.ok ? await r.text() : '<div class="text-danger">No se pudo renderizar.</div>';
  }

  confirmBtn.addEventListener('click', async ()=>{
    if(!chosen) return;
    stepChooser.classList.add('d-none');
    stepResult.classList.remove('d-none');
    await loadView();
  });

  btnBack.addEventListener('click', ()=>{
    stepResult.classList.add('d-none');
    stepChooser.classList.remove('d-none');
    viewEl.innerHTML = '';
  });

  // Descargar PDF asegurando que analysis_json viaja SIEMPRE
  btnPdf.addEventListener('click', ()=>{
    if(!pdfEndpoint) return;
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = pdfEndpoint;
    form.target = '_blank';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'analysis_json';
    input.value = jsonEl.value;
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    form.remove();
  });
})();
</script>
