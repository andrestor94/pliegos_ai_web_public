<!-- templates/analysis/modal.html -->
<div id="modalAnalysis" class="sa-modal-overlay" aria-modal="true" role="dialog">
  <div class="sa-modal sa-modal-lg" role="document" tabindex="-1">
    <button class="sa-modal-close" type="button" aria-label="Cerrar"
            onclick="this.closest('#modalAnalysis')?.remove();document.body.style.overflow='';">✕</button>

    <h2 class="sa-modal-title">Resultado del análisis</h2>

    <!-- JSON para backend / export -->
    <textarea id="analysis-json" name="analysis_json" hidden>{{ analysis_json|tojson }}</textarea>

    <!-- Tabs -->
    <div class="sa-tabs mb-3" role="tablist" aria-label="Tipos de vista">
      <button class="sa-tab active" data-tab="structured" role="tab" aria-selected="true">Vista estructurada</button>
      <button class="sa-tab" data-tab="deep" role="tab" aria-selected="false">Análisis profundo</button>
    </div>

    <!-- Contenido -->
    <div class="sa-tabpanes">
      <!-- Pane: Estructurado (auto-carga) -->
      <div id="pane-structured" class="sa-pane active" role="tabpanel" aria-labelledby="tab-structured">
        <div class="sa-skel">
          <div class="sa-skel-line w-30"></div>
          <div class="sa-skel-line w-80"></div>
          <div class="sa-skel-line w-90"></div>
          <div class="sa-skel-line w-70"></div>
        </div>
      </div>

      <!-- Pane: Profundo (carga perezosa al seleccionar) -->
      <div id="pane-deep" class="sa-pane" role="tabpanel" aria-labelledby="tab-deep" data-loaded="false">
        <div class="text-muted small">Seleccioná “Análisis profundo” para cargar la narrativa detallada…</div>
      </div>
    </div>

    <!-- Acciones (opcional: export PDF) -->
    <div class="sa-actions mt-3">
      <button type="button" class="btn btn-light" data-export="structured">Exportar PDF (estructurado)</button>
      <button type="button" class="btn btn-light" data-export="deep">Exportar PDF (profundo)</button>
      <div class="flex-grow-1"></div>
      <button type="button" class="btn btn-outline-secondary" onclick="this.closest('#modalAnalysis')?.remove();document.body.style.overflow='';">Cerrar</button>
    </div>
  </div>
</div>

<style>
/* ===== Modal base ===== */
.sa-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:1050;padding:16px}
.sa-modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(980px,96vw);padding:20px;position:relative}
.sa-modal-title{font-size:22px;font-weight:700;margin:6px 0 16px}
.sa-modal-close{border:0;background:transparent;font-size:18px;position:absolute;top:16px;right:18px;cursor:pointer;opacity:.65}
.sa-modal-close:hover{opacity:1}

/* ===== Tabs ===== */
.sa-tabs{display:flex;gap:8px;border-bottom:1px solid var(--sa-border,#e6e8eb)}
.sa-tab{appearance:none;border:0;background:transparent;padding:10px 14px;border-bottom:2px solid transparent;font-weight:600;cursor:pointer;border-top-left-radius:8px;border-top-right-radius:8px}
.sa-tab.active{border-color:var(--sa-primary,#0d6efd);color:var(--sa-primary,#0d6efd);background:rgba(13,110,253,.06)}
.sa-tab:focus{outline:2px solid rgba(13,110,253,.25);outline-offset:2px}

/* ===== Panes ===== */
.sa-tabpanes{padding-top:12px}
.sa-pane{display:none}
.sa-pane.active{display:block}

/* ===== Skeleton ===== */
.sa-skel{display:grid;gap:10px;padding:8px 0}
.sa-skel-line{height:12px;background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:saShine 1.2s ease-in-out infinite;border-radius:6px}
.sa-skel-line.w-30{width:30%}.sa-skel-line.w-70{width:70%}.sa-skel-line.w-80{width:80%}.sa-skel-line.w-90{width:90%}
@keyframes saShine{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===== Actions ===== */
.sa-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>

<script>
(function(){
  const modal = document.getElementById('modalAnalysis');
  if (!modal) return;

  // Asegurar que cuelgue del <body>
  if (modal.parentElement !== document.body) document.body.appendChild(modal);
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  const json = modal.querySelector('#analysis-json')?.value || '{}';

  // Auto-cargar estructurado al abrir
  (async function loadStructured(){
    const pane = modal.querySelector('#pane-structured');
    try{
      const fd = new FormData(); fd.append('analysis_json', json);
      const r = await fetch('/render/structured', { method:'POST', body:fd, headers:{'X-Requested-With':'fetch'} });
      pane.innerHTML = await r.text();
    }catch(e){
      pane.innerHTML = '<div class="alert alert-danger">No se pudo cargar la vista estructurada.</div>';
    }
  })();

  // Tab switching + carga perezosa del profundo
  modal.querySelectorAll('.sa-tab').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tab = btn.dataset.tab;
      modal.querySelectorAll('.sa-tab').forEach(b=>{
        b.classList.toggle('active', b.dataset.tab===tab);
        b.setAttribute('aria-selected', b.dataset.tab===tab ? 'true' : 'false');
      });
      modal.querySelectorAll('.sa-pane').forEach(p=>p.classList.remove('active'));
      const pane = modal.querySelector(`#pane-${tab}`);
      pane.classList.add('active');

      if (tab==='deep' && pane.dataset.loaded!=='true'){
        // skeleton
        pane.innerHTML = `
          <div class="sa-skel">
            <div class="sa-skel-line w-50"></div>
            <div class="sa-skel-line w-90"></div>
            <div class="sa-skel-line w-85"></div>
            <div class="sa-skel-line w-70"></div>
          </div>`;
        try{
          const fd = new FormData(); fd.append('analysis_json', json);
          const r = await fetch('/render/deep', { method:'POST', body:fd, headers:{'X-Requested-With':'fetch'} });
          pane.innerHTML = await r.text();
          pane.dataset.loaded = 'true';
        }catch(e){
          pane.innerHTML = '<div class="alert alert-danger">No se pudo cargar el análisis profundo.</div>';
        }
      }
    });
  });

  // Export PDF (opcional)
  const jsonInput = modal.querySelector('#analysis-json');
  function exportPdf(kind){
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = (kind==='structured') ? '/export/pdf/estructurado' : '/export/pdf/profundo';
    form.target = '_blank';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'analysis_json';
    input.value = jsonInput?.value || '{}';
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    form.remove();
  }
  modal.querySelectorAll('[data-export]').forEach(btn=>{
    btn.addEventListener('click', ()=> exportPdf(btn.getAttribute('data-export')));
  });

  // Esc para cerrar
  modal.addEventListener('keydown', (ev)=>{ if(ev.key==='Escape'){ modal.remove(); document.body.style.overflow=''; }});
})();
</script>
