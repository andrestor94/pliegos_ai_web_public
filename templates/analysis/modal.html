<!-- templates/analysis/modal.html -->
<div id="analysis-modal" class="analysis-modal-overlay" aria-modal="true" role="dialog">
  <div class="analysis-modal" role="document">
    <button class="close" type="button" aria-label="Cerrar"
            onclick="(function(){const el=document.getElementById('analysis-modal'); if(el) el.remove();})();">×</button>

    <h3 class="title">Seleccioná el tipo de análisis</h3>

    <!-- JSON para backend -->
    <textarea id="analysis-json" name="analysis_json" hidden>{{ analysis_json|tojson }}</textarea>

    <div class="options">
      <button class="card" id="opt-estr" type="button">
        <div class="icon">📊</div>
        <div class="card-title">Análisis Estructurado</div>
        <div class="desc">Extracción de datos clave (tablas, cantidades, fechas, requisitos).</div>
      </button>

      <button class="card" id="opt-deep" type="button">
        <div class="icon">📝</div>
        <div class="card-title">Análisis Profundo</div>
        <div class="desc">Resumen redactado e insights de contexto y riesgos.</div>
      </button>
    </div>

    <div id="analysis-result" class="result">
      <!-- Aquí se inyecta el HTML devuelto por /render/* -->
    </div>

    <div class="actions">
      <!-- Descarga según selección -->
      <form id="dl-estr" method="post" action="/export/pdf/estructurado" target="_blank" style="display:none">
        <input type="hidden" name="analysis_json" id="aj-estr">
        <button type="submit" class="btn">Descargar PDF</button>
      </form>

      <form id="dl-deep" method="post" action="/export/pdf/profundo" target="_blank" style="display:none">
        <input type="hidden" name="analysis_json" id="aj-deep">
        <button type="submit" class="btn">Descargar PDF</button>
      </form>

      <button class="btn outline" type="button"
              onclick="(function(){const el=document.getElementById('analysis-modal'); if(el) el.remove();})();">
        Cerrar
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  // 1) Asegura que el overlay cuelgue del <body> (para que sea realmente flotante)
  const root = document.getElementById('analysis-modal');
  if (root && root.parentElement !== document.body) {
    document.body.appendChild(root);
  }

  // 2) Copia el JSON a los formularios de descarga
  const json = document.getElementById('analysis-json')?.value || '';
  const estrHidden = document.getElementById('aj-estr');
  const deepHidden = document.getElementById('aj-deep');
  if (estrHidden) estrHidden.value = json;
  if (deepHidden) deepHidden.value = json;

  // 3) Utilidad para POST y pintar resultado
  async function renderTo(url){
    const out = document.getElementById('analysis-result');
    try {
      const fd = new FormData();
      fd.append('analysis_json', json);
      const r = await fetch(url, { method: 'POST', body: fd, headers: { 'X-Requested-With': 'fetch' }});
      const html = await r.text();
      out.innerHTML = html;
      out.scrollTop = 0;
    } catch(e) {
      out.innerHTML = '<div class="text-danger">Error renderizando la vista.</div>';
    }
  }

  // 4) Handlers de tarjetas (sin HTMX)
  function show(which){
    document.getElementById('dl-estr').style.display = (which==='estr') ? 'inline-block' : 'none';
    document.getElementById('dl-deep').style.display = (which==='deep') ? 'inline-block' : 'none';
  }

  document.getElementById('opt-estr')?.addEventListener('click', () => {
    show('estr'); renderTo('/render/structured');
  });
  document.getElementById('opt-deep')?.addEventListener('click', () => {
    show('deep'); renderTo('/render/deep');
  });

  // 5) Preselección (opcional): carga Estructurado de arranque
  // show('estr'); renderTo('/render/structured');
})();
</script>

<style>
  .analysis-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);
    display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}
  .analysis-modal{position:relative;background:#fff;border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:980px;width:100%;padding:20px}
  .analysis-modal .close{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:22px;line-height:1}
  .title{margin:0 0 8px 0}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 10px}
  .card{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid #e5e7eb;
    border-radius:12px;padding:22px;background:#f8fafc;cursor:pointer; width:100%}
  .card:hover{background:#eef2ff;border-color:#c7d2fe}
  .card-title{font-weight:600}
  .desc{font-size:14px;color:#475569;text-align:center}
  .result{margin-top:14px;max-height:48vh;overflow:auto;border-top:1px solid #e5e7eb;padding-top:10px}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:8px 12px;border-radius:10px;border:0;background:#0ea5e9;color:#fff}
  .btn.outline{background:#fff;border:1px solid #cbd5e1;color:#0f172a}
  @media (max-width:768px){.options{grid-template-columns:1fr}}
</style>
